spring.application.name=disasterManagement

# H2 Database Configuration for Production
spring.datasource.url=jdbc:h2:file:/tmp/disaster_management
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}

# Disable H2 Console in Production
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:YourSecretKeyHereMakeItLongAndComplexForSecurityReasons}
app.jwt.expiration=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always

# Logging Configuration
logging.level.org.springframework=WARN
logging.level.com.example.disasterManagement=INFO
logging.level.org.hibernate=WARN

# Razorpay Configuration (Optional - leave empty for demo mode)
razorpay.api.key=${RAZORPAY_KEY_ID:}
razorpay.api.secret=${RAZORPAY_KEY_SECRET:}

# Production security settings
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
